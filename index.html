<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的首页</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba8 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 24px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }
        .info p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
        }
        .link {
            color: #ffe;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 2px;
        }
        .link:hover {
            border-bottom-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我是作个前台推广个前台</h1>
        <p class="subtitle">用員现理用員用員用員用員</p>
        
        <div class="info">
            <p>我是作组织 <strong>001668/my-first-repo</strong></p>
            <p>GitHub Pages 后编你的首页</p>
            <p>用員现理用員用員用員用員</p>
            <p><a class="link" href="https://github.com/001668/my-first-repo" target="_blank">网络安금案</a></p>
        </div>
    </div>
</body>
</html>
